name: technical-home-assessment - Main

on:
  workflow_dispatch:

jobs:

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short


  run-pipeline:
    name: Execute Pipeline
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Output Directories
        run: |
          mkdir -p output
          mkdir -p logs

      - name: Execute Pipeline
        run: |
          python main.py \
            --data-dir ./data/raw \
            --no-delta \
            --output-path ./output

      - name: List Generated Files
        run: |
          echo "Generated files:"
          find output -type f || true

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-output
          path: output/


  validate:
    name: Validate Results
    needs: run-pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Validation Information
        run: |
          echo "Pipeline execution completed successfully."


  report:
    name: Final Report
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Pipeline Status
        run: |
          echo "======================================"
          echo "Andromeda Pipeline Completed"
          echo "Environment : Main"
          echo "Status      : SUCCESS"
          echo "======================================"
