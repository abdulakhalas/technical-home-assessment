name: Andromeda Pipeline - Main

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: "CSV data directory"
        required: true
        default: "./data/raw"

      catalog:
        description: "Catalog name"
        required: false
        default: "andromeda"

      schema:
        description: "Schema name"
        required: false
        default: "wind_farm"

  schedule:
    - cron: "0 6 * * *"

env:
  ENVIRONMENT: main

jobs:

  # -------------------------------------------------------
  # Step 1 - Run Tests
  # -------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short

  # -------------------------------------------------------
  # Step 2 - Execute Pipeline
  # -------------------------------------------------------
  run-pipeline:
    name: Execute Pipeline
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Output Folder
        run: |
          mkdir -p output
          mkdir -p logs

      - name: Execute Main Pipeline
        run: |
          python main.py \
            --environment main \
            --data-dir "${{ github.event.inputs.data_dir || './data/raw' }}" \
            --catalog "${{ github.event.inputs.catalog || 'andromeda' }}" \
            --schema "${{ github.event.inputs.schema || 'wind_farm' }}"

      - name: Upload Pipeline Outputs
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-output
          path: |
            output/**
            logs/**

  # -------------------------------------------------------
  # Step 3 - Validate Output
  # -------------------------------------------------------
  validate:
    name: Validate Results
    needs: run-pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Output Files
        run: |

          echo "Checking output files..."

          test -f output/raw_turbine_readings.csv
          echo "✓ raw_turbine_readings.csv exists"

          test -f output/cleaned_turbine_readings.csv
          echo "✓ cleaned_turbine_readings.csv exists"

          test -f output/turbine_summary_statistics.csv
          echo "✓ turbine_summary_statistics.csv exists"

          test -f output/turbine_anomalies.csv
          echo "✓ turbine_anomalies.csv exists"

          echo "Validation successful."

      - name: Display Record Counts
        run: |

          echo "Output Summary"

          wc -l output/raw_turbine_readings.csv || true
          wc -l output/cleaned_turbine_readings.csv || true
          wc -l output/turbine_summary_statistics.csv || true
          wc -l output/turbine_anomalies.csv || true

  # -------------------------------------------------------
  # Step 4 - Report
  # -------------------------------------------------------
  report:
    name: Final Report
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Pipeline Status
        run: |
          echo "================================="
          echo "Andromeda Pipeline Completed"
          echo "Environment : main"
          echo "Catalog     : ${{ github.event.inputs.catalog || 'andromeda' }}"
          echo "Schema      : ${{ github.event.inputs.schema || 'wind_farm' }}"
          echo "================================="
